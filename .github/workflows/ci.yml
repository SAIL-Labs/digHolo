name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Cancel in-flight PR builds when a new push lands on the same branch. Push
# events to main / tags are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned Intel oneAPI Base Toolkit. Bump deliberately. Intel rotates the
  # offline-installer URL hash every release — the canonical place to look
  # for a current URL is Intel's own CI workflow at:
  #   https://github.com/oneapi-src/oneapi-ci/blob/master/.github/workflows/build_all.yml
  # (search for WINDOWS_BASEKIT_URL).
  ONEAPI_VERSION_LINUX: "2025.3"
  WINDOWS_BASEKIT_URL: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/1f18901e-877d-469d-a41a-a10f11b39336/intel-oneapi-base-toolkit-2025.3.0.372_offline.exe"
  WINDOWS_BASEKIT_COMPONENTS: "intel.oneapi.win.mkl.devel"

  # FFTW3 version built from source inside the manylinux container. Pinned
  # for reproducibility; bump as needed.
  FFTW_VERSION: "3.3.10"

jobs:
  # ------------------------------------------------------------------------
  build-linux:
    name: Linux x86_64 (manylinux_2_28, static FFTW3 + libstdc++)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    # Build inside PyPA's manylinux_2_28 container (AlmaLinux 8 / glibc 2.28).
    # This is the same container cibuildwheel uses, so the artefact we produce
    # here is also the foundation for the planned Python wheel.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:latest

    steps:
      - uses: actions/checkout@v4

      # ---- Intel oneAPI MKL via yum -----------------------------------
      - name: Add Intel oneAPI yum repo
        run: |
          tee /etc/yum.repos.d/oneAPI.repo > /dev/null <<'EOF'
          [oneAPI]
          name=Intel oneAPI repository
          baseurl=https://yum.repos.intel.com/oneapi
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          EOF

      - name: Cache Intel oneAPI MKL install
        id: cache-mkl
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: oneapi-mkl-${{ env.ONEAPI_VERSION_LINUX }}-manylinux_2_28-x86_64

      - name: Install Intel oneAPI MKL (yum)
        if: steps.cache-mkl.outputs.cache-hit != 'true'
        run: |
          dnf install -y intel-oneapi-mkl-devel

      # ---- FFTW3 built from source, static, single precision, -fPIC ---
      - name: Cache static FFTW3 install
        id: cache-fftw
        uses: actions/cache@v4
        with:
          path: /usr/local/fftw3
          key: fftw3-${{ env.FFTW_VERSION }}-manylinux_2_28-static-single-fPIC-avx2

      - name: Build static FFTW3
        if: steps.cache-fftw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO "https://www.fftw.org/fftw-${FFTW_VERSION}.tar.gz"
          tar xf "fftw-${FFTW_VERSION}.tar.gz"
          cd "fftw-${FFTW_VERSION}"
          ./configure \
            --prefix=/usr/local/fftw3 \
            --enable-single \
            --enable-static \
            --disable-shared \
            --enable-sse2 \
            --enable-avx \
            --enable-avx2 \
            --enable-fma \
            CFLAGS="-fPIC -O3"
          make -j"$(nproc)"
          make install

      - name: Expose FFTW3 install to later steps
        run: |
          echo "CMAKE_PREFIX_PATH=/usr/local/fftw3" >> "$GITHUB_ENV"
          # find_library needs the .a on its search path
          echo "LIBRARY_PATH=/usr/local/fftw3/lib" >> "$GITHUB_ENV"
          echo "CPATH=/usr/local/fftw3/include" >> "$GITHUB_ENV"

      # ---- Source oneAPI env -----------------------------------------
      - name: Source MKL environment
        # We installed only intel-oneapi-mkl-devel — but yum drags in the
        # intel-oneapi-compiler-shared-runtime as a dep, which makes the
        # umbrella setvars.sh source compiler/env/vars.sh too. That script
        # references OCL_ICD_FILENAMES unconditionally and aborts under
        # `set -u`. Skip the umbrella entirely and source just MKL's vars.sh
        # — that's all we actually need.
        shell: bash
        run: |
          set -eo pipefail
          source /opt/intel/oneapi/mkl/latest/env/vars.sh
          {
            echo "MKLROOT=${MKLROOT}"
            echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-}:/usr/local/fftw3"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
            echo "LIBRARY_PATH=${LIBRARY_PATH:-}:/usr/local/fftw3/lib"
            echo "CPATH=${CPATH:-}:/usr/local/fftw3/include"
          } >> "$GITHUB_ENV"
          echo "${PATH}" | tr ':' '\n' >> "$GITHUB_PATH"

      # ---- Build tools (cmake + ninja via pip — manylinux doesn't ship
      #      either at a recent-enough version by default) --------------
      - name: Install CMake + Ninja
        run: |
          /opt/python/cp311-cp311/bin/pip install --upgrade 'cmake>=3.21' ninja
          # Expose them on PATH for subsequent steps.
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Test
        run: ctest --preset linux-release

      - name: Verify runtime dependencies of .so (should NOT link libfftw3f / libstdc++)
        run: |
          echo "--- ldd on libdigholo.so ---"
          ldd build/linux-release/libdigholo.so* | tee ldd.out
          # Any libstdc++ or libfftw3f dependency means we didn't actually
          # achieve a portable build; fail the job so the regression is
          # caught at CI time rather than by end users.
          if grep -E 'libstdc\+\+|libfftw3f' ldd.out; then
            echo "::error::portable-build regression: shared lib pulls in libstdc++ or libfftw3f"
            exit 1
          fi

      - name: Stage release artefacts
        run: |
          mkdir -p artefacts/digholo-linux-x64/{lib,bin,include}
          cp -P build/linux-release/libdigholo.so*  artefacts/digholo-linux-x64/lib/
          cp    build/linux-release/digHolo         artefacts/digholo-linux-x64/bin/
          cp    src/digHolo.h                       artefacts/digholo-linux-x64/include/
          cp    README.md build.md                  artefacts/digholo-linux-x64/
          ls -la artefacts/digholo-linux-x64/lib artefacts/digholo-linux-x64/bin

      - uses: actions/upload-artifact@v4
        with:
          name: digholo-linux-x64
          path: artefacts/digholo-linux-x64/
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  build-windows:
    name: Windows x86_64 (MKL + FFTW3)
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      ONEAPI_INSTALL_DIR: C:\Program Files (x86)\Intel\oneAPI

    steps:
      - uses: actions/checkout@v4

      # NOTE: do NOT use ilammy/msvc-dev-cmd here — that action overrides
      # VCPKG_ROOT with its own bundled vcpkg path, breaking the toolchain
      # file lookup. The "Visual Studio 17 2022" CMake generator finds MSVC
      # via vswhere and invokes MSBuild internally; cl.exe on PATH isn't
      # needed.

      # ---- vcpkg --------------------------------------------------------
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (Test-Path "$env:VCPKG_ROOT") {
            Remove-Item -Recurse -Force "$env:VCPKG_ROOT"
          }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bincache-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-x64-windows-

      # ---- Intel oneAPI MKL --------------------------------------------
      - name: Cache Intel oneAPI MKL install
        id: cache-oneapi
        uses: actions/cache@v4
        with:
          path: ${{ env.ONEAPI_INSTALL_DIR }}
          key: oneapi-mkl-${{ env.WINDOWS_BASEKIT_URL }}

      - name: Download Intel oneAPI Base Toolkit installer
        if: steps.cache-oneapi.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Downloading from $env:WINDOWS_BASEKIT_URL"
          $ProgressPreference = 'SilentlyContinue'
          curl.exe -L --retry 3 --retry-delay 5 -o webimage.exe "$env:WINDOWS_BASEKIT_URL"
          (Get-Item webimage.exe).Length / 1MB

      - name: Install Intel oneAPI MKL (silent)
        # Install pattern lifted from Intel's official oneapi-src/oneapi-ci
        # (scripts/install_windows.bat). The NEED_VS*_INTEGRATION=0 flags
        # skip the VS plug-in install — we only need MKL itself.
        if: steps.cache-oneapi.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          start /b /wait webimage.exe -s -x -f webimage_extracted --log extract.log
          del webimage.exe
          webimage_extracted\bootstrapper.exe -s --action install ^
            --components=%WINDOWS_BASEKIT_COMPONENTS% ^
            --eula=accept ^
            -p=NEED_VS2017_INTEGRATION=0 ^
            -p=NEED_VS2019_INTEGRATION=0 ^
            -p=NEED_VS2022_INTEGRATION=0 ^
            --log-dir=.
          rmdir /s /q webimage_extracted

      - name: Source oneAPI environment
        shell: pwsh
        # setvars.bat is a cmd script. Run it from cmd, dump the resulting env,
        # then forward only the oneAPI-relevant vars (PATH goes to GITHUB_PATH,
        # one entry per line; the rest go to GITHUB_ENV).
        run: |
          $forwarded = 'ONEAPI_ROOT|MKLROOT|CMPLR_ROOT|TBBROOT|CMAKE_PREFIX_PATH|INCLUDE|LIB|LIBPATH'
          cmd.exe /c "call `"$env:ONEAPI_INSTALL_DIR\setvars.bat`" --force >nul && set" | ForEach-Object {
            if ($_ -match "^($forwarded)=(.*)$") {
              "$($matches[1])=$($matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
            elseif ($_ -match '^PATH=(.*)$') {
              $matches[1].Split(';') | Where-Object { $_ -ne '' } |
                Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            }
          }

      # ---- Build --------------------------------------------------------
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --config Release

      - name: Test
        shell: pwsh
        run: ctest --preset windows-release

      # ---- Artefacts ----------------------------------------------------
      - name: Stage release artefacts
        shell: pwsh
        run: |
          $stage = "artefacts/digholo-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/bin", "$stage/lib", "$stage/include" | Out-Null
          Copy-Item build/windows-release/Release/digholo.dll "$stage/bin/"
          Copy-Item build/windows-release/Release/digholo.lib "$stage/lib/"
          Copy-Item build/windows-release/Release/digHolo.exe "$stage/bin/"
          Copy-Item src/digHolo.h "$stage/include/"
          Copy-Item README.md, build.md $stage
          Get-ChildItem -Recurse $stage

      - uses: actions/upload-artifact@v4
        with:
          name: digholo-windows-x64
          path: artefacts/digholo-windows-x64/
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Package per-platform tarballs / zips
        run: |
          set -e
          cd dist
          ls -la
          tar -czf ../digholo-linux-x64.tar.gz   -C digholo-linux-x64   .
          (cd digholo-windows-x64 && zip -r ../../digholo-windows-x64.zip .)
          ls -la ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            digholo-linux-x64.tar.gz
            digholo-windows-x64.zip
